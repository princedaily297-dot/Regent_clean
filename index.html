<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REGENT_TECH • RegentClean Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #05070f;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(244, 63, 94, 0.18), transparent 42%),
        radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.18), transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(16, 185, 129, 0.09), transparent 50%),
        linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .glass-panel {
      background: linear-gradient(165deg, rgba(15, 23, 42, 0.85), rgba(9, 13, 26, 0.9));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.65);
    }

    /* Live Rotating Orbital System */
    .orbital-stage {
      perspective: 900px;
    }
    @keyframes liveOrbitCW {
      0% {
        transform: rotateX(64deg) rotateY(-14deg) rotateZ(0deg);
      }
      100% {
        transform: rotateX(64deg) rotateY(-14deg) rotateZ(360deg);
      }
    }
    @keyframes liveOrbitCCW {
      0% {
        transform: rotateX(66deg) rotateY(18deg) rotateZ(360deg);
      }
      100% {
        transform: rotateX(66deg) rotateY(18deg) rotateZ(0deg);
      }
    }
    @keyframes liveEquator {
      0% {
        transform: rotateX(72deg) rotateZ(0deg);
      }
      100% {
        transform: rotateX(72deg) rotateZ(360deg);
      }
    }
    @keyframes coreBreath {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 24px rgba(244, 63, 94, 0.22), 0 0 40px rgba(99, 102, 241, 0.16);
      }
      50% {
        transform: scale(1.025);
        box-shadow: 0 0 32px rgba(244, 63, 94, 0.36), 0 0 54px rgba(99, 102, 241, 0.28);
      }
    }
    .orbit-track-1 {
      transform-style: preserve-3d;
      animation: liveOrbitCW 5.5s linear infinite;
    }
    .orbit-track-2 {
      transform-style: preserve-3d;
      animation: liveOrbitCCW 8s linear infinite;
    }
    .orbit-track-3 {
      transform-style: preserve-3d;
      animation: liveEquator 11s linear infinite;
    }
    .regent-core-badge {
      animation: coreBreath 3.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-between px-4 py-5 selection:bg-rose-500 selection:text-white">

  <!-- TOP LIVE ROTATING ORBITAL REGENT_TECH SIGN -->
  <header class="w-full max-w-md pt-1 pb-2">
    <div class="glass-panel rounded-3xl p-4 relative overflow-hidden flex flex-col items-center justify-center text-center">
      <!-- Radial Nebula Backdrop -->
      <div class="absolute inset-0 bg-gradient-to-r from-rose-600/15 via-indigo-600/15 to-emerald-500/10 pointer-events-none"></div>

      <!-- Live Rotating Orbital Stage -->
      <div class="orbital-stage relative w-full h-28 flex items-center justify-center">
        <!-- Orbit Ring 1 (Fast Rose Satellite) -->
        <div class="orbit-track-1 absolute w-64 h-64 rounded-full border border-rose-400/45 shadow-[0_0_24px_rgba(244,63,94,0.22)]">
          <span class="absolute -top-2 left-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-rose-400 shadow-[0_0_14px_#fb7185]"></span>
          <span class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-2 h-2 rounded-full bg-pink-300 shadow-[0_0_10px_#f9a8d4]"></span>
        </div>

        <!-- Orbit Ring 2 (Counter-Rotating Indigo Node) -->
        <div class="orbit-track-2 absolute w-56 h-56 rounded-full border border-indigo-400/50 shadow-[0_0_24px_rgba(99,102,241,0.22)]">
          <span class="absolute top-1/2 -right-2 -translate-y-1/2 w-3 h-3 rounded-full bg-indigo-400 shadow-[0_0_14px_#818cf8]"></span>
        </div>

        <!-- Orbit Ring 3 (Outer Emerald Pulse Track) -->
        <div class="orbit-track-3 absolute w-72 h-72 rounded-full border border-dashed border-emerald-400/30">
          <span class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399]"></span>
        </div>

        <!-- Center Big REGENT_TECH Sign -->
        <div class="regent-core-badge relative z-10 px-5 py-2 rounded-2xl bg-slate-950/85 border border-white/15 backdrop-blur-md">
          <h1 class="font-display font-bold text-2xl sm:text-3xl tracking-[0.14em] bg-gradient-to-r from-white via-rose-200 to-indigo-200 bg-clip-text text-transparent">
            REGENT_TECH
          </h1>
        </div>
      </div>

      <p class="text-[11px] font-mono uppercase tracking-[0.2em] text-slate-400 mt-1">
        RegentClean Media &amp; Audio Studio
      </p>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="w-full max-w-md my-auto py-3 space-y-3.5">

    <!-- Creator & Portrait Card -->
    <section class="glass-panel rounded-3xl p-3.5 flex items-center gap-3.5">
      <div class="w-16 h-16 rounded-2xl overflow-hidden border border-rose-400/50 bg-slate-950 shrink-0 shadow-md shadow-rose-500/15">
        <img
          src="https://i.ibb.co/6R5gDdNP/file-00000000583881f4850db020c90ef767.png"
          alt="Regent_clean portrait"
          class="w-full h-full object-cover object-top"
        />
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
            <span class="font-display font-bold text-sm text-white truncate">Regent_clean</span>
          </div>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-300 border border-rose-500/25 shrink-0">
            Creator
          </span>
        </div>
        <p class="text-xs text-slate-300 mt-1 leading-snug">
          Download watermark-free TikTok videos or extract audio from any video on your device.
        </p>
      </div>
    </section>

    <!-- Mode Switcher Tabs -->
    <div class="grid grid-cols-2 gap-1.5 p-1.5 rounded-2xl glass-panel">
      <button
        type="button"
        id="tab-tiktok"
        onclick="switchMode('tiktok')"
        class="py-2.5 px-3 rounded-xl text-xs font-display font-semibold flex items-center justify-center gap-1.5 bg-rose-600 text-white shadow-md shadow-rose-600/25 transition">
        <i data-lucide="clapperboard" class="w-3.5 h-3.5"></i>
        <span>Clean Video</span>
      </button>
      <button
        type="button"
        id="tab-audio"
        onclick="switchMode('audio')"
        class="py-2.5 px-3 rounded-xl text-xs font-display font-semibold flex items-center justify-center gap-1.5 text-slate-300 hover:text-white hover:bg-slate-800/60 transition">
        <i data-lucide="file-audio" class="w-3.5 h-3.5"></i>
        <span>Video to Audio</span>
      </button>
    </div>

    <!-- MODE 1: TikTok Clean Video Resolver -->
    <section id="panel-tiktok" class="glass-panel rounded-3xl p-5 space-y-4">
      <div>
        <h2 class="font-display text-lg font-bold tracking-tight text-white">Watermark-Free Video</h2>
        <p class="text-xs text-slate-400 mt-0.5">Paste a public TikTok link to preview, save HD MP4, or grab audio.</p>
      </div>

      <form id="clean-form" class="space-y-3" novalidate>
        <div class="relative flex items-center">
          <input
            type="url"
            id="tiktok-url"
            required
            placeholder="https://www.tiktok.com/@user/video/..."
            class="w-full bg-slate-950/90 border border-slate-800 focus:border-rose-500 rounded-2xl pl-3.5 pr-20 py-3 font-mono text-xs text-white placeholder-slate-500 focus:outline-none transition"
          />
          <button
            type="button"
            id="paste-btn"
            onclick="handlePasteOrClear()"
            class="absolute right-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 flex items-center gap-1 transition">
            <i data-lucide="clipboard-paste" class="w-3.5 h-3.5"></i>
            <span id="paste-label">Paste</span>
          </button>
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 active:scale-[0.99] transition py-3 rounded-2xl font-display font-semibold text-sm text-white shadow-lg shadow-rose-600/25 flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>Get Clean Video</span>
        </button>
      </form>

      <!-- Status / Error Box -->
      <div id="status-msg" class="hidden text-xs text-amber-200 bg-amber-500/10 border border-amber-500/25 rounded-2xl p-3 flex items-start gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 text-amber-300 shrink-0 mt-0.5"></i>
        <span id="status-text"></span>
      </div>

      <!-- Result Box -->
      <div id="result-box" class="hidden pt-4 border-t border-slate-800/90 space-y-3.5">
        <div class="flex items-center gap-3">
          <img
            id="author-avatar"
            src=""
            alt=""
            class="w-10 h-10 rounded-full object-cover border border-slate-700 bg-slate-800 shrink-0"
          />
          <div class="min-w-0 flex-1">
            <p id="author-label" class="font-semibold text-sm text-white truncate"></p>
            <p id="title-label" class="text-xs text-slate-400 line-clamp-2"></p>
          </div>
        </div>

        <div class="rounded-2xl overflow-hidden bg-black border border-slate-800">
          <video id="video-preview" controls playsinline class="w-full max-h-80 object-contain"></video>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center bg-slate-950/75 rounded-2xl py-2.5 px-2 border border-slate-800/80 font-mono">
          <div>
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-sans">Views</p>
            <p id="stat-plays" class="text-xs font-semibold text-slate-200 mt-0.5">—</p>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-sans">Likes</p>
            <p id="stat-likes" class="text-xs font-semibold text-slate-200 mt-0.5">—</p>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-wider text-slate-500 font-sans">Shares</p>
            <p id="stat-shares" class="text-xs font-semibold text-slate-200 mt-0.5">—</p>
          </div>
        </div>

        <div class="space-y-2">
          <button
            type="button"
            id="direct-dl-btn"
            onclick="downloadDirectVideo()"
            class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] transition py-3 rounded-2xl font-display text-xs font-semibold text
